[build-system]
requires = ["setuptools>=77.0", "wheel"]  # 77: SPDX `license` and `license-files` (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "contitool"
# pip needs PEP 440; the version users see is contitool.__version__ ("2.0.3a"). a/b/c only passed by
# chance (pip reads them as alpha/beta/rc); "d", "e" have no such meaning, so the n-th 2.0.1 fix is post<n>.
version = "2.0.3.post1"
description = "ContiTool — Desktop GUI Studio & CLI for Continental VAG MQB Gateway J533 (Renesas RH850/F1L)"
readme = "README.md"
# PolyForm Noncommercial 1.0.0 plus the Additional Terms at the top of LICENSE, so not the bare SPDX id
license = "LicenseRef-PolyForm-Noncommercial-1.0.0-ContiTool"
license-files = ["LICENSE", "LICENSES/*", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
authors = [
    { name = "PerkTheFox", email = "noreply@antonperk.com" }
]
dependencies = [
    "PySide6-Essentials>=6.6.0",
    "python-can>=4.3.0",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.5.0",
]

[project.urls]
Homepage = "https://vwhacking.antonperk.com"
Repository = "https://github.com/perkthefox/mqb_contitool"
Issues = "https://github.com/perkthefox/mqb_contitool/issues"
Changelog = "https://github.com/perkthefox/mqb_contitool/blob/main/CHANGELOG.md"
Telegram = "https://t.me/perkthefox"
Drive2 = "https://www.drive2.ru/users/perkthefox/"

[project.scripts]
contitool = "contitool.cli.main:main"

[project.gui-scripts]
contitool-gui = "contitool.gui.app:run_gui"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
