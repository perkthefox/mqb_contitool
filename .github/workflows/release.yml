name: Build & Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-executables:
    name: Build (${{ matrix.target_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_name: Windows-x64
            os: windows-latest
          - target_name: macOS-arm64
            os: macos-latest
          - target_name: Linux-x64
            os: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux headless Qt libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install package & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite before packaging
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -v

      - name: Build standalone GUI executable (.exe / .app / .dmg)
        run: python scripts/build_release.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ContiTool-${{ matrix.target_name }}
          path: dist/release/*
          if-no-files-found: error

  publish-github-release:
    name: Publish GitHub Release
    needs: build-executables
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform release archives
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
